UPSTREAM_URL=https://github.com/KOWX712/Tricky-Addon-Update-Target-List.git
UPSTREAM_BRANCH=main
ZIP_PREFIX=TrickyAddonModule
VERSION_CODE_FLOOR=740
CHANGELOG_PATH=changelog.md
# upstream release job: WebUI via pnpm, versionCode = commit count, zip of module/
build() {
    # WebUI module updates (webui/src/update.ts; the root manager never sees updateJson because
    # TA_utl hides module.prop): stable reads this fork's .forgejo/update.json (versionCode,
    # version, zipUrl, changelog), canary (nightly.link artifacts) is routed to the same channel.
    # Workspace only; assume-unchanged keeps the tree clean.
    python3 -I - webui/src/update.ts "$SERVER_URL/$REPOSITORY/raw/branch/main/.forgejo/update.json" <<'PY' >&2
import sys
path, url = sys.argv[1:]
s = open(path).read()
for old, new in (
    ("const UPDATE_JSON_URL = `${RAW_URL}/main/update.json`", f"const UPDATE_JSON_URL = '{url}'"),
    ("const NIGHTLY_LINK = `https://nightly.link/${GITHUB_REPO}/workflows/build/main?preview`", f"const NIGHTLY_LINK = '{url}'"),
    ("    if (channel === 'stable') return this.#checkStableUpdate()\n", "    if (channel === 'stable' || channel === 'canary') return this.#checkStableUpdate()\n"),
    ("    if (channel === 'stable') return this.#performStableUpdate()\n", "    if (channel === 'stable' || channel === 'canary') return this.#performStableUpdate()\n"),
):
    if s.count(old) != 1:
        sys.exit(f"update.ts: expected one '{old}'")
    s = s.replace(old, new)
open(path, "w").write(s)
print("update.ts: Forgejo update channel")
PY
    git update-index --assume-unchanged webui/src/update.ts
    (cd webui && pnpm install --frozen-lockfile && pnpm build) >&2
    sed -i "s/^versionCode=.*/versionCode=$(git rev-list --count HEAD)/" module/module.prop
    (cd module && zip -qr9 "$OUT/module.zip" ./*)
}
# release step (module-ci.sh:274-277, after update.json is written at :267-273): add the zip's sha256 as
# zipSha256; the WebUI updater (webui/src/update.ts) installs a downloaded zip only when its sha256 matches
release_files() {
    [[ "$ZIP_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "release_files: bad ZIP_SHA '$ZIP_SHA'" >&2; return 1; }
    python3 -I - "$UPDATE_JSON_PATH" "$ZIP_SHA" <<'PY'
import json, sys
path, sha = sys.argv[1:]
with open(path) as f:
    data = json.load(f)
data["zipSha256"] = sha
with open(path, "w") as f:
    f.write(json.dumps(data, indent=2) + "\n")
PY
    RELEASE_FILES="$UPDATE_JSON_PATH"
}
