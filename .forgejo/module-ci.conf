UPSTREAM_URL=https://github.com/KOWX712/Tricky-Addon-Update-Target-List.git
UPSTREAM_BRANCH=main
ZIP_PREFIX=TrickyAddonModule
VERSION_CODE_FLOOR=740
CHANGELOG_PATH=changelog.md
# upstream release job: WebUI via pnpm, versionCode = commit count, zip of module/
build() {
    (cd webui && pnpm install --frozen-lockfile && pnpm build) >&2
    sed -i "s/^versionCode=.*/versionCode=$(git rev-list --count HEAD)/" module/module.prop
    (cd module && zip -qr9 "$OUT/module.zip" ./*)
}
